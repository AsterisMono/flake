<!doctype html>
<!--
THROWAWAY BROWSER PROTOTYPE. No desktop APIs, no persistence, no live herdr.

Rebuilt 2026-09-27 from the live Quickshell sources, then restyled.
Structure, copy, and sample-data patterns follow the QML. The previous
desk-rails snapshot (Return thread, notification layout variants, glass
option switcher, job percentages, Stop/Retry, Undo) is gone: those
controls are not in the shell.

Authoritative sources:
  shell.qml, Bar.qml, TopBar.qml, BottomBar.qml, Desktop.qml
  Theme.qml, ShellState.qml, PopupHost.qml
  BannerHost.qml, Osd.qml, OsdHost.qml, Notices.qml
  popups/CalendarPopup.qml, IdentityPopup.qml, MediaPopup.qml,
    HealthPopup.qml, AudioPopup.qml, PowerPopup.qml,
    WindowListPopup.qml, WorkPopup.qml, NotificationCenter.qml
  work/WorkInFlight.qml, WorkSummary.qml, FixtureSource.qml, AgentUsage.qml
  components/BarButton.qml, PopupFrame.qml, PopupHeader.qml, NoticeRow.qml,
    AgentRow.qml, TaskRow.qml, ActionButton.qml, MeterSlider.qml,
    QuotaRow.qml, BalanceRow.qml, Waycat.qml
  docs/quickshell/0001-v1-core-shell.md, 0002-v2-work-in-flight.md

Phase 1 is this document's regions and behaviour. Phase 2 is the default
material: Clearlooks 2 / GNOME 2 panel grammar, not a recolor of the glass
rails. ?theme=glass restores the Stylix / Catppuccin Mocha glass reading
from Theme.qml (bar 0.72 occupied / 0.50 empty, popup 0.40, OSD 0.85).
Clearlooks does not use backdrop-filter.

Reference lock for the Clearlooks pass:
  Primary: Fedora GNOME 2 panel (thin beveled strips, applet buttons that
    are flat until prelight and sunken when open, a recessed workspace
    switcher, task buttons) plus Clearlooks 2.20 widgets (raised buttons,
    inset wells, glossy blue list selection).
  Icons: filled drawings in the Tango palette. Not the Lucide stroke set,
    and not the shipped Tango or Crystal icon themes.
  Type: DejaVu Sans, the Bitstream Vera continuation.
  Wallpaper: a generated blue field for Clearlooks. The late-afternoon sky
    stays on ?theme=glass only.
  Reject: smoked glass as the default, Adwaita-flat, Compiz, Crystal candy,
    and modern capsule chrome.

Compromises: the icons are original filled drawings, not Tango assets.
The live shell's applets stay, so the panel is busier than stock
Applications / Places / System. There is no Metacity.

Sky, glass theme only: the generated wallpaper is not in the repository.
The page paints a CSS stand-in. Provenance prompt, kept from the earlier
prototype: wide 16:9 photograph of a quiet late-afternoon blue sky,
naturally detailed clouds, muted cornflower/blue-grey, warm ivory edges
and dusty peach lower clouds; calm center, cloud texture at both edges,
no land, objects, text or UI.

Prototype dock (the "Prototype" palette) is not shell chrome. Hide it
with ?dock=0. Open a panel with ?popup=work|notifications|clock|identity|
media|health|power|audio|windows. Fixture: ?fixture=flights|idle|empty|
disconnected|incompatible.
-->

    background: var(--fill); border-color: rgba(205,214,244,.18); box-shadow: none;
  }

    background: var(--selected-tint); border-color: var(--accent); color: var(--text);
  }
  .row-gap { display: flex; gap: 8px; }
  .row-gap .choice { flex: 1; justify-content: center; }
  .stack { display: flex; flex-direction: column; gap: 0; }
  .media-row { display: flex; gap: 12px; align-items: center; }
  .art {
    width: 92px; height: 92px; flex: 0 0 92px;

  .transport { display: flex; gap: 8px; justify-content: center; }
  .times { display: flex; justify-content: space-between; font: 10px/1 var(--mono); color: var(--muted); }
  .cal-head, .cal-week, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  .cal-nav { display: flex; align-items: center; gap: 8px; }

  .cal-week { margin: 8px 0 4px; color: var(--muted); font: 10px/1 var(--mono); text-align: center; }
  .day {
    height: 28px; display: flex; align-items: center; justify-content: center;

  .field-label { margin: 12px 0 0; color: var(--muted); font: 10px/1 var(--mono); letter-spacing: 1.1px; }
  .meter {
    position: relative; height: 22px; margin-top: 6px; cursor: pointer; touch-action: none;
  }
  .meter .groove {
    position: absolute; left: 0; right: 0; top: 9px; height: 4px; border-radius: 2px;
    background: var(--track);
    box-shadow: inset 0 1px 1px rgba(0,0,0,.25), 0 1px 0 rgba(255,255,255,.7);
  }
  html[data-theme="glass"] .meter .groove { box-shadow: none; height: 3px; top: 10px; border-radius: 1px; }
  .meter .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: inherit; background: var(--track-fill); }
  .meter .thumb {
    position: absolute; top: 6px; width: 12px; height: 12px; margin-left: -6px; border-radius: 6px;
    background: linear-gradient(to bottom, #fff, #dedede);
    border: 1px solid #6e6e6e;
    box-shadow: inset 0 1px 0 #fff;
  }
  html[data-theme="glass"] .meter .thumb {
    width: 9px; height: 9px; top: 7px; margin-left: -4px; border-radius: 5px;
    background: var(--text); border-color: rgba(30,30,46,.9); box-shadow: none;
  }
  .empty-notes { height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); }
  .notice {
    position: relative; padding: 12px 20px; border-bottom: 1px solid rgba(46,52,54,.10);
  }
  .notice.critical { box-shadow: inset 2px 0 var(--critical); }
  .notice-top { display: flex; align-items: center; gap: 8px; color: var(--muted); font: 10px/1 var(--mono); min-height: 20px; }
  .notice-top .app { flex: 1; min-width: 0; }
  .notice h3 { margin: 6px 0 0; font: 500 13px/1.35 var(--font); }

  .notice .push { margin-top: 8px; }
  .hit { display: block; width: 100%; text-align: left; background: none; border: 0; color: inherit; padding: 0; }

  .banners {
    position: fixed; z-index: 34; top: calc(var(--bar-h) + 8px); right: 12px;
    width: 360px; display: flex; flex-direction: column; gap: 8px;
    pointer-events: none;
  }
  .banners.aside { right: calc(8px + 384px + 16px); }
  .banner {

    border: 1px solid var(--edge); border-radius: var(--radius);

    box-shadow: none;
    border-color: rgba(205,214,244,.10);
  }
  .banner .notice { border: 0; padding: 8px 12px 12px; }
  .transient-note { margin: 4px 0 0; font-size: 9px; color: var(--muted); }

  .osd {
    position: fixed; z-index: 36; left: 50%; bottom: calc(var(--bar-h) + 16px);
    width: 288px; transform: translateX(-50%);
    pointer-events: none;
  }
  .osd-card {
    padding: 16px; border-radius: var(--radius); border: 1px solid var(--edge);
    background: linear-gradient(to bottom, #fbfbfb, #e6e6e6);
    box-shadow: inset 0 1px 0 #fff, 0 1px 2px rgba(0,0,0,.18);
  }
  html[data-theme="glass"] .osd-card {
    background: var(--plate-osd);

  .osd-row { display: flex; align-items: center; gap: 12px; }
  .osd-label { flex: 1; color: var(--muted); font: 11px/1 var(--mono); letter-spacing: 1px; text-transform: uppercase; }
  .osd-value { font: 500 24px/1 var(--mono); }
  .gauge { height: 4px; margin-top: 12px; border-radius: 1px; background: var(--track); overflow: hidden; }
  .gauge > i { display: block; height: 100%; background: var(--accent); }
  .gauge > i.warn { background: var(--attention); }
  .gauge > i.quiet { background: var(--muted); }

  .dock {
    position: fixed; z-index: 32; top: calc(var(--bar-h) + 12px); left: 12px;
    width: min(340px, calc(100vw - 24px));
    padding: 10px 10px 8px;
    border: 1px solid var(--edge); border-radius: var(--radius);
    background: var(--plate); color: var(--text);
    box-shadow: inset 0 1px 0 var(--hilight), 1px 2px 8px rgba(0,0,0,.16);
  }
  html[data-theme="glass"] .dock {
    background: rgba(30,30,46,.92); backdrop-filter: blur(16px); box-shadow: none;
  }
  .dock h2 { margin: 0 0 2px; font: 700 11px/1.2 var(--font); letter-spacing: .08em; }
  .dock .hint { margin: 0 0 8px; color: var(--muted); font-size: 11px; }
  .dock-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .dock button, .dock select {
    border: 1px solid #9a9a9a; border-radius: 3px;
    background: var(--fill); color: var(--text);
    box-shadow: inset 0 1px 0 #fff;
    padding: 3px 7px; font-size: 11px;
  }
  html[data-theme="glass"] .dock button, html[data-theme="glass"] .dock select {
    background: rgba(205,214,244,.08); border-color: rgba(205,214,244,.2); box-shadow: none; color: var(--text);
  }
  .dock button.on { outline: 1px solid var(--accent); }
  .dock .status { margin: 4px 0 0; color: var(--muted); font: 10px/1.35 var(--mono); }
  .dock-tab {
    position: fixed; z-index: 32; top: calc(var(--bar-h) + 12px); left: 0;
    writing-mode: vertical-rl; padding: 8px 4px;
    border: 1px solid var(--edge); border-left: 0; border-radius: 0 3px 3px 0;
    background: var(--plate); color: var(--muted); font-size: 11px;
  }
  body:not(.dock-off) .sample { left: 368px; }
  body.dock-off .dock { display: none; }
  body:not(.dock-off) .dock-tab { display: none; }
  body.no-sample .sample { display: none; }

  @media (max-width: 1180px) {
    .metrics, .clock-date { display: none; }
  }
  @media (max-width: 820px) {
    .vol-read { display: none; }
    .center-slot { position: static; transform: none; max-width: 42px; }
    .media-text { display: none; }
  }
  @media (max-width: 720px) {
    .sample { display: none; }
    .banners, .banners.aside { right: 8px; width: min(360px, calc(100vw - 16px)); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }

function relative(timeMs) {
  const seconds = Math.max(0, Math.round((Date.now() - timeMs) / 1000));
  if (seconds < 45) return "Just now";
  const minutes = Math.round(seconds / 60);
  if (minutes < 60) return minutes + " min";
  const hours = Math.round(minutes / 60);
  if (hours < 24) return hours + " h";
  return Math.round(hours / 24) + " d";
}

function orderedWindows() {
  return state.windows.slice().sort((a, b) => {
    const aw = Number(a.ws), bw = Number(b.ws);
    if (aw !== bw) return aw - bw;
    if (a.x !== b.x) return a.x - b.x;
    if (a.y !== b.y) return a.y - b.y;
    return a.id - b.id;
  });
}

function visibleWindows(capacity) {
  const list = orderedWindows();
  if (capacity <= 0 || list.length <= capacity) return list;
  const chosen = {};
  for (let i = 0; i < capacity; i++) chosen[i] = true;
  const focus = list.findIndex((w) => w.id === state.focusedId);
  if (focus >= capacity) {
    delete chosen[capacity - 1];
    chosen[focus] = true;
  }
  return list.filter((_, i) => chosen[i]);
}

function occupied() { return state.windows.some((w) => w.ws === state.workspace); }

function awakeSummary() {
  if (!state.awake) return "Off";
  if (state.awakeMinutes === 0) return "Until turned off";
  const remaining = Math.max(0, state.awakeUntil - Date.now());
  const minutes = Math.floor(remaining / 60000);
  const hours = Math.floor(minutes / 60);
  const rest = minutes % 60;
  if (hours > 0) return rest ? hours + " h " + rest + " min left" : hours + " h left";
  return rest + " min left";
}

function setAwake(on, minutes) {
  state.awake = on;
  state.awakeMinutes = minutes;
  state.awakeUntil = on && minutes > 0 ? Date.now() + minutes * 60000 : 0;
  state.status = on ? "Keep awake · " + awakeSummary() + ". Locking by hand still works." : "Keep awake is off.";
}

function volumeText() { return Math.round(state.volume * 100) + "%"; }

function osdSuppressed(kind) {
  if (!state.popup) return false;
  if (kind === "audio" && state.popup === "audio") return true;
  if (kind === "brightness" && state.popup === "power") return true;
  const popup = document.getElementById("popup");
  if (!popup || popup.hidden) return false;
  const pr = popup.getBoundingClientRect();
  const card = { x: (innerWidth - 288) / 2, y: innerHeight - 30 - 16 - 78, w: 288, h: 78 };
  const c = 8;
  return pr.left < card.x + card.w + c && card.x < pr.right + c && pr.top < card.y + card.h + c && card.y < pr.bottom + c;
}

function showOsd(kind) {
  if (osdSuppressed(kind)) {
    state.osd = null;
    renderOsd();
    return;
  }
  state.osd = kind;
  renderOsd();
  clearTimeout(state.osdTimer);
  state.osdTimer = setTimeout(() => { state.osd = null; renderOsd(); }, 1200);
}

function setVolume(value, fromUser) {
  state.volume = Math.max(0, Math.min(1.5, value));
  if (fromUser) showOsd("audio");
}

function setBrightness(value) {
  const next = Math.max(0, Math.min(100, value));
  if (state.brightnessFailed) {
    state.status = "The backlight did not accept that change; the reading above is what the machine reports.";
    showOsd("brightness");
    return;
  }
  state.brightness = next;
  showOsd("brightness");
}

function markAllRead() { savedNotices().forEach((n) => { n.read = true; }); }

function closePopup() {
  state.popup = null;
  state.anchorId = null;
  renderPopup();
  renderBars();
}

function openPopup(kind, anchorId) {
  if (state.popup === kind) { closePopup(); return; }
  if (kind === "notifications") markAllRead();
  state.popup = kind;
  state.anchorId = anchorId || null;
  if (state.osd && osdSuppressed(state.osd)) state.osd = null;
  render();
}

function focusWindow(id) {
  const win = state.windows.find((w) => w.id === id);
  if (!win) return;
  state.focusedId = id;
  state.workspace = win.ws;
  closePopup();
}

function closeWindow(id) {
  state.windows = state.windows.filter((w) => w.id !== id);
  if (state.focusedId === id) {
    const next = orderedWindows()[0];
    state.focusedId = next ? next.id : -1;
    if (next) state.workspace = next.ws;
  }
  state.status = "Close requested. The task leaves when the compositor confirms — here, immediately.";
  render();
}

function focusWorkspace(name) {
  state.workspace = name;
  const onIt = orderedWindows().filter((w) => w.ws === name);
  state.focusedId = onIt.length ? onIt[0].id : state.focusedId;
  closePopup();
}

function stepWorkspace(from, direction) {
  const names = ["1", "2", "3", "4", "5", "6", "7", "8"];
  const index = names.indexOf(from);
  if (index < 0) return;
  const target = Math.max(0, Math.min(names.length - 1, index + (direction > 0 ? 1 : -1)));
  if (target !== index) focusWorkspace(names[target]);
}

function agentRow(agent) {
  let label = "Idle", icon = "", tone = "muted", note = "";
  if (agent.state === "working") { label = "Working"; icon = "clock"; tone = "muted"; }
  else if (agent.state === "blocked") { label = "Needs you"; icon = "blocked"; tone = "tone-attention"; note = "Herdr reports blocked; input may be needed."; }
  else if (agent.state === "done") { label = "Ready to review"; icon = "ready"; tone = "tone-accent"; note = "Herdr reports done. Ready for your review."; }
  else if (agent.state === "unknown") { label = "State unavailable"; tone = "muted"; note = "Herdr cannot classify this agent right now."; }
  const title = agent.title || agent.name || "Agent";
  const path = agent.cwd.replace("/home/nvirellia", "~");
  const context = [agent.name, agent.ws, path].filter(Boolean).join(" · ");
  return { title, context, label, icon, tone, note, pane: agent.pane };
}

function meter(name, ratio) {

}

function calendarHTML() {
  const now = new Date();

  const days = new Date(month.getFullYear(), month.getMonth() + 1, 0).getDate();
  let cells = "";
  for (let i = 0; i < leading; i++) cells += "<span></span>";
  for (let day = 1; day <= days; day++) {
    const today = state.monthOffset === 0 && day === now.getDate();
    cells += `<span class="day ${today ? "today" : ""}">${day}</span>`;
  }
  return `<div class="cal-nav">
      <button type="button" class="icon-btn" data-action="month" data-delta="-1" aria-label="Previous month">‹</button>
      <h2>${esc(MONTHSLONG[month.getMonth()] + " " + month.getFullYear())}</h2>

    <button type="button" class="push" data-action="today" ${state.monthOffset === 0 ? "disabled" : ""}>${svg("calendar", "sm")} Back to today</button>`;
}

}

function placePopup() {
  const el = document.getElementById("popup");
  if (!state.popup) return;
  const bottom = state.popup === "windows" || state.popup === "work";
  const anchor = state.anchorId ? document.getElementById(state.anchorId) : null;
  const width = el.offsetWidth;
  const margin = 8;
  let x = anchor ? anchor.getBoundingClientRect().left + anchor.offsetWidth / 2 - width / 2 : (innerWidth - width) / 2;
  x = Math.max(margin, Math.min(x, innerWidth - width - margin));
  el.style.left = x + "px";
  el.style.right = "auto";
  if (bottom) {
    el.style.top = "auto";
    el.style.bottom = "34px";
  } else {
    el.style.bottom = "auto";
    el.style.top = "34px";
  }
}

function renderPopup() {
  const el = document.getElementById("popup");
  const catcher = document.getElementById("catcher");
  if (!state.popup) {
    el.hidden = true;
    el.innerHTML = "";
    catcher.hidden = true;
    return;
  }
  el.hidden = false;
  catcher.hidden = false;
  el.className = "popup" + (state.popup === "work" ? " work" : "") + (state.popup === "notifications" ? " notices" : "");
  el.style.width = (state.popup === "work" ? 400 : state.popup === "notifications" ? 384 : 380) + "px";
  el.setAttribute("aria-label", state.popup);
  el.innerHTML = popupHTML();
  placePopup();
  const banners = document.getElementById("banners");
  banners.classList.toggle("aside", state.popup === "notifications");
}

  el.hidden = false;
  el.innerHTML = `<div class="osd-card" role="status">
    <div class="osd-row">${svg(audio ? audioIcon() : "brightness", "lg")}<span class="osd-label">${esc(label)}</span><span class="osd-value ${muted ? "muted" : ""}">${percent}%</span></div>
    <div class="gauge"><i class="${tone}" style="width:${ratio * 100}%"></i></div>
  </div>`;
}

function renderDesktop() {
  document.body.classList.toggle("no-sample", !state.sample);
  const el = document.getElementById("desktop");
  if (!state.sample) { el.innerHTML = ""; return; }
  el.innerHTML = `<section class="sample" aria-label="Sample window">
    <div class="titlebar">
      <span class="grow ellipsis">shell.qml — flake</span>
      <button type="button" class="win-btn" data-action="sample" aria-label="Close sample window">×</button>
    </div>
    <div class="gnome-menu"><span>File</span><span>Edit</span><span>View</span><span>Search</span><span>Tools</span><span>Documents</span><span>Help</span></div>
    <div class="gnome-toolbar">
      <button type="button">${svg("document")}New</button>
      <button type="button">${svg("folder")}Open</button>
      <button type="button">${svg("save")}Save</button>
    </div>
    <div class="sample-tabs"><span class="sample-tab on">shell.qml</span><span class="sample-tab">Theme.qml</span></div>
    <div class="sample-body">
      <div class="gutter">1\n2\n3\n4\n5\n6</div>
      <pre class="code"><span class="c"># Illustrative window, not the shell.</span>
<span class="k">PanelWindow</span> {
  anchors.top: <span class="k">true</span>
  implicitHeight: Theme.barHeight
  <span class="c"># Exclusive edges. Popups open from them.</span>
}</pre>
    </div>
    <div class="sample-status"><span>flake</span><span>Plain text</span></div>
  </section>`;
}

function renderDock() {
  document.body.classList.toggle("dock-off", !state.dock);
  const tab = document.getElementById("dock-tab");
  tab.hidden = state.dock;
  const el = document.getElementById("dock");
  if (!state.dock) { el.innerHTML = ""; return; }
  const pops = [["clock", "Calendar"], ["identity", "Identity"], ["media", "Media"], ["health", "Health"], ["power", "Power"], ["audio", "Audio"], ["windows", "Windows"], ["work", "Agents"], ["notifications", "Bell"]];
  el.innerHTML = `<h2>PROTOTYPE</h2>
    <p class="hint">Not part of the shell. Structure is the live QML; this palette only drives the sample.</p>
    <div class="dock-row">
      <button type="button" data-proto="theme" class="${state.theme === "clearlooks" ? "on" : ""}">Clearlooks</button>
      <button type="button" data-proto="theme-glass" class="${state.theme === "glass" ? "on" : ""}">Glass</button>
      <button type="button" data-proto="hide">Hide</button>
    </div>
    <div class="dock-row">${pops.map(([id, label]) => `<button type="button" data-popup="${id}" class="${state.popup === id ? "on" : ""}">${label}</button>`).join("")}</div>
    <div class="dock-row">
      <button type="button" data-proto="banner">Banner</button>
      <button type="button" data-proto="critical">Critical</button>
      <button type="button" data-proto="transient">Transient</button>
      <button type="button" data-proto="osd-audio">OSD volume</button>
      <button type="button" data-proto="osd-bright">OSD brightness</button>
    </div>
    <div class="dock-row">
      <button type="button" data-proto="dnd" class="${state.dnd ? "on" : ""}">DND</button>
      <button type="button" data-proto="awake" class="${state.awake ? "on" : ""}">Awake</button>
      <button type="button" data-proto="sample" class="${state.sample ? "on" : ""}">Sample window</button>
      <button type="button" data-proto="reject" class="${state.brightnessFailed ? "on" : ""}">Backlight reject</button>
      <label class="muted">Fixture
        <select data-proto="fixture">
          ${["flights", "idle", "empty", "disconnected", "incompatible"].map((name) => `<option ${name === state.fixture ? "selected" : ""}>${name}</option>`).join("")}
        </select>
      </label>
      <button type="button" data-proto="reset">Reset</button>
    </div>
    <p class="status" id="status">${esc(state.status)}</p>`;
}

function render() {
  document.documentElement.dataset.theme = state.theme;
  renderBars();
  renderDesktop();
  renderPopup();
  renderBanners();
  renderOsd();
  renderDock();
}

function setMeterFromEvent(name, event, el) {
  const groove = el.querySelector(".groove");
  const rect = groove.getBoundingClientRect();
  const ratio = rect.width ? Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width)) : 0;
  if (name === "volume") setVolume(ratio * 1.5, true);
  else if (name === "brightness") setBrightness(ratio * 100);
  else if (name === "seek") state.position = ratio * state.length;
  const shown = name === "volume" ? state.volume / 1.5 : name === "brightness" ? state.brightness / 100 : state.position / state.length;
  const fill = el.querySelector(".fill");
  const thumb = el.querySelector(".thumb");
  if (fill) fill.style.width = (shown * 100) + "%";
  if (thumb) thumb.style.left = (shown * 100) + "%";
  if (name === "seek") {
    const times = document.querySelector(".times");
    if (times) times.innerHTML = `<span>${formatTime(state.position)}</span><span>${formatTime(state.length)}</span>`;
  }
  if (name === "volume" || name === "brightness") {
    renderBars();
    if (state.popup === "power" || state.popup === "audio") {
      const label = document.querySelector(".field-label");
      if (name === "brightness" && state.popup === "power" && label) {
        label.innerHTML = `<span>BRIGHTNESS</span><span>${svg("brightness", "sm")} ${Math.round(state.brightness)}%</span>`;
      }
    }
  }
}

document.addEventListener("click", (event) => {
  const proto = event.target.closest("[data-proto]");
  if (proto) {
    const kind = proto.dataset.proto;
    if (kind === "fixture") return;
    if (kind === "theme") state.theme = "clearlooks";
    else if (kind === "theme-glass") state.theme = "glass";
    else if (kind === "hide") state.dock = false;
    else if (kind === "banner") {
      addRecord({ app: "herdr", summary: "A note can wait", body: "Ordinary completion stays in the panel. This banner is the transient half of the same record." }, true);
      state.status = state.dnd ? "Do Not Disturb paused that banner. It is still in the panel." : "Banner shown. It expires; the history entry stays.";
    } else if (kind === "critical") {
      addRecord({ app: "sway", summary: "Log out", body: "Critical notifications still banner while Do Not Disturb is on.", urgency: "critical", actions: [{ id: "default", text: "Log out" }, { id: "cancel", text: "Stay" }] }, true);
      state.status = "Critical banner. It is not saved as confirmation.";
    } else if (kind === "transient") {
      if (state.dnd) state.status = "Transient notification paused by Do Not Disturb. Not saved.";
      else {
        addRecord({ app: "Media", summary: "Volume changed", body: "", transient: true }, true);
        state.status = "Transient banner. Not saved to history.";
      }
    } else if (kind === "osd-audio") showOsd("audio");
    else if (kind === "osd-bright") showOsd("brightness");
    else if (kind === "dnd") { state.dnd = !state.dnd; state.status = state.dnd ? "Do Not Disturb pauses banners. Critical still shows. Unread counts stay." : "Do Not Disturb is off."; }
    else if (kind === "awake") setAwake(!state.awake, state.awake ? state.awakeMinutes : 60);
    else if (kind === "sample") state.sample = !state.sample;
    else if (kind === "reject") { state.brightnessFailed = !state.brightnessFailed; state.status = state.brightnessFailed ? "The next brightness change will be rejected." : "Brightness changes apply."; }
    else if (kind === "reset") {
      state.windows = seedWindows();
      state.focusedId = 1;
      state.workspace = "1";
      state.dnd = false;
      state.awake = false;
      state.volume = 0.7;
      state.muted = false;
      state.brightness = 64;
      state.brightnessFailed = false;
      state.profile = "balanced";
      state.fixture = "flights";
      state.playing = true;
      state.position = 74;
      seedNotices();
      state.popup = null;
      state.status = "Sample session reset.";
    }
    const params = new URLSearchParams();
    if (state.theme !== "clearlooks") params.set("theme", state.theme);
    if (!state.dock) params.set("dock", "0");
    history.replaceState(null, "", params.toString() ? "?" + params.toString() : location.pathname);
    render();
    return;
  }

  const popupBtn = event.target.closest("[data-popup]");
  if (popupBtn) {
    openPopup(popupBtn.dataset.popup, popupBtn.id || null);
    return;
  }
  const actionEl = event.target.closest("[data-action]");
  if (!actionEl) {
    if (event.target.id === "catcher") closePopup();
    return;
  }
  const action = actionEl.dataset.action;
  if (action === "close") closePopup();
  else if (action === "workspace") focusWorkspace(actionEl.dataset.ws);
  else if (action === "task") focusWindow(Number(actionEl.dataset.id));
  else if (action === "tray") state.status = actionEl.dataset.tray + " keeps its own menu. This prototype does not open one.";
  else if (action === "month") state.monthOffset += Number(actionEl.dataset.delta);
  else if (action === "today") state.monthOffset = 0;
  else if (action === "media-toggle") state.playing = !state.playing;
  else if (action === "media-prev") state.status = "Previous track. The player choice stays put.";
  else if (action === "media-next") state.status = "Next track.";
  else if (action === "btop") state.status = "Would open btop. Nothing was launched.";
  else if (action === "mixer") state.status = "Would open pavucontrol. Nothing was launched.";
  else if (action === "mute") { state.muted = !state.muted; showOsd("audio"); }
  else if (action === "profile") {
    if (actionEl.dataset.profile === "performance" && !state.performance) return;
    state.profile = actionEl.dataset.profile;
    state.status = "Power profile · " + actionEl.textContent.trim();
  }
  else if (action === "awake-toggle") setAwake(!state.awake, state.awakeMinutes || 60);
  else if (action === "awake-30") setAwake(true, 30);
  else if (action === "awake-60") setAwake(true, 60);
  else if (action === "awake-0") setAwake(true, 0);
  else if (action === "sink") { state.sink = actionEl.dataset.sink; state.status = "Output · " + actionEl.textContent.trim(); }
  else if (action === "dnd") { state.dnd = !state.dnd; state.status = state.dnd ? "Do Not Disturb is on. Banners pause; the panel does not." : "Do Not Disturb is off."; }
  else if (action === "clear") {
    if (savedNotices().length) { state.notices = state.notices.filter((n) => n.transient); state.banners = []; state.status = "History cleared. There is no undo."; }
  }
  else if (action === "dismiss") {
    const id = Number(actionEl.dataset.id);
    state.notices = state.notices.filter((n) => n.id !== id);
    state.banners = state.banners.filter((bid) => bid !== id);
    state.status = "Dismissed from this session. There is no undo.";
  }
  else if (action === "hide-banner") {
    const id = Number(actionEl.dataset.id);
    state.banners = state.banners.filter((bid) => bid !== id);
    state.status = "Banner closed. The notification stays in the panel until it is dismissed there.";
  }
  else if (action === "activate") {
    const record = findNotice(Number(actionEl.dataset.id));
    if (record) {
      const actionItem = (record.actions || []).find((item) => item.id === "default") || (record.actions || [])[0];
      state.notices = state.notices.filter((n) => n.id !== record.id);
      state.banners = state.banners.filter((bid) => bid !== record.id);
      state.status = actionItem ? "Action “" + actionItem.text + "” was delivered. Nothing else ran." : "Opened “" + record.summary + "”.";
    }
  }
  else if (action === "invoke") {
    const record = findNotice(Number(actionEl.dataset.id));
    const actionItem = record && (record.actions || []).find((item) => item.id === actionEl.dataset.invoke);
    if (record) record.read = true;
    state.banners = state.banners.filter((bid) => bid !== Number(actionEl.dataset.id));
    state.status = actionItem ? "Action “" + actionItem.text + "” was delivered. The session was not changed." : "No such action.";
  }
  else if (action === "open-agent") {
    state.status = "Sample session · nothing was focused (" + actionEl.dataset.pane + ").";
  }
  else if (action === "sample") state.sample = false;
  render();
});

document.addEventListener("auxclick", (event) => {
  if (event.button !== 1) return;
  const task = event.target.closest("[data-action='task']");
  if (task) { event.preventDefault(); closeWindow(Number(task.dataset.id)); return; }
  const audio = event.target.closest("#btn-audio");
  if (audio) { state.muted = !state.muted; showOsd("audio"); render(); }
});

document.addEventListener("contextmenu", (event) => {
  if (event.target.closest("#btn-audio")) {
    event.preventDefault();
    state.status = "Would open pavucontrol. Nothing was launched.";
    renderDock();
  }
});

document.addEventListener("wheel", (event) => {
  const audio = event.target.closest("#btn-audio");
  if (audio) {
    event.preventDefault();
    setVolume(state.volume + (event.deltaY < 0 ? 0.01 : -0.01), true);
    renderBars();
    if (state.popup === "audio") renderPopup();
    return;
  }
  const ws = event.target.closest("[data-action='workspace']");
  if (ws) {
    event.preventDefault();
    stepWorkspace(ws.dataset.ws, event.deltaY < 0 ? 1 : -1);
  }
}, { passive: false });

document.addEventListener("pointerdown", (event) => {
  const meterEl = event.target.closest("[data-meter]");
  if (!meterEl) return;
  state.dragging = meterEl.dataset.meter;
  meterEl.setPointerCapture(event.pointerId);
  setMeterFromEvent(state.dragging, event, meterEl);
});
document.addEventListener("pointermove", (event) => {
  if (!state.dragging) return;
  const meterEl = document.querySelector('[data-meter="' + state.dragging + '"]');
  if (meterEl) setMeterFromEvent(state.dragging, event, meterEl);
});
document.addEventListener("pointerup", () => { state.dragging = null; });

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && state.popup) closePopup();
  const meterEl = event.target.closest && event.target.closest("[data-meter]");
  if (!meterEl) return;
  const name = meterEl.dataset.meter;
  const step = event.key === "ArrowRight" || event.key === "ArrowUp" ? 0.02 : event.key === "ArrowLeft" || event.key === "ArrowDown" ? -0.02 : 0;
  if (!step) return;
  event.preventDefault();
  if (name === "volume") setVolume(state.volume + step * 1.5, true);
  else if (name === "brightness") setBrightness(state.brightness + step * 100);
  else if (name === "seek") state.position = Math.max(0, Math.min(state.length, state.position + step * state.length));
  render();
});

document.getElementById("dock-tab").addEventListener("click", () => {
  state.dock = true;
  const params = new URLSearchParams(location.search);
  params.delete("dock");
  if (state.theme !== "clearlooks") params.set("theme", state.theme);
  history.replaceState(null, "", params.toString() ? "?" + params.toString() : location.pathname);
  render();
});

document.getElementById("dock").addEventListener("change", (event) => {
  if (event.target.dataset.proto === "fixture") {
    state.fixture = event.target.value;
    state.status = sourceLine();
    render();
  }
});

window.addEventListener("resize", () => { renderBars(); if (state.popup) placePopup(); });

setInterval(() => {
  const clock = document.getElementById("clock-text");
  const date = document.getElementById("clock-date");
  const now = new Date();
  if (clock) clock.textContent = clockTime(now);
  if (date) date.textContent = innerWidth < 1180 ? "" : clockDate(now) + " · ";
  document.querySelectorAll("[data-time]").forEach((el) => { el.textContent = relative(Number(el.dataset.time)); });
  const nowMs = Date.now();
  const before = state.banners.length;
  state.banners = state.banners.filter((id) => {
    const record = findNotice(id);
    return record && !(record.bannerDeadline > 0 && nowMs >= record.bannerDeadline);
  });
  if (state.banners.length !== before) renderBanners();
}, 1000);

render();
if (state.pendingPopup && ["clock", "identity", "media", "health", "power", "audio", "windows", "work", "notifications"].includes(state.pendingPopup)) {
  openPopup(state.pendingPopup, "btn-" + (state.pendingPopup === "notifications" ? "bell" : state.pendingPopup === "clock" ? "clock" : state.pendingPopup));
}
</script>
</body>
</html>
